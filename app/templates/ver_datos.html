
{% extends "base.html" %}

{% block content %}
<div class="p-4">

    <h4>Vista previa del archivo</h4>
    <p class="text-muted">{{ filename }} (primeras 50 filas)</p>

    <a href="{{ url_for('datos') }}" class="btn btn-secondary mt-3">
        Volver a Datos
    </a>

    <div class="table-responsive mt-3">
        <table class="table table-bordered table-sm">
            <thead class="table-light">
                <tr>
                    {% for col in columnas %}
                        <th>{{ col }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for fila in filas %}
                <tr>
                    {% for valor in fila %}
                        <td>{{ valor }}</td>
                    {% endfor %}
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>



</div>
{% endblock %}
